<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c853" />
      <stop offset="100%" style="stop-color:#69f0ae" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="#0f1923"/>
  
  <!-- Green swoosh arc - behind letters -->
  <path d="M 100 360 C 100 200, 200 140, 256 140 C 320 140, 400 200, 420 340" 
        fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Letter F - bold and clean -->
  <path d="M 150 160 L 150 350 L 180 350 L 180 270 L 230 270 L 230 240 L 180 240 L 180 190 L 240 190 L 240 160 Z" 
        fill="white"/>
  
  <!-- Letter Z - bold and clean -->
  <path d="M 270 160 L 360 160 L 360 190 L 300 260 L 360 260 L 360 350 L 270 350 L 270 320 L 330 250 L 270 250 Z" 
        fill="white"/>
</svg>